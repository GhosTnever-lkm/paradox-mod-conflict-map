name: Mod Conflict Map release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify app and regression tests
        run: |
          node --check app.js
          node --check conflict-core.mjs
          node --test
      - name: Build release ZIP and checksum
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="Mod-Conflict-Map-v${version}.zip"
          zip -r "$archive" index.html styles.css app.js conflict-core.mjs README.md CHANGELOG.md LICENSE VERSION tests
          sha256sum "$archive" > "${archive}.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Mod-Conflict-Map-v${GITHUB_REF_NAME#v}.zip" "Mod-Conflict-Map-v${GITHUB_REF_NAME#v}.zip.sha256" --title "Mod Conflict Map ${GITHUB_REF_NAME}" --generate-notes
